  :root {
    --bg: #15161c;
    --panel: #1e2029;
    --line: #2b2e3a;
    --text: #e6e8ef;
    --dim: #8b90a3;
    --faint: #5a5f72;
    --accent: #16a34a;
    --accent-hi: #1fbe59;
    --rosu: #f87171;
    --sec: #282b36;
    --sec-hi: #343846;
    --free: #2f3342;
    --free-line: #3d4256;
    --free-text: #c9cee0;
    --used: #1a1c24;
    --used-line: #22252f;
    --used-text: #464b5c;
    --gold: #f0b429;
    --gold-line: #ffcf5c;
    --gold-text: #241a00;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }

  body {
    padding: max(14px, env(safe-area-inset-top)) 14px
             max(14px, env(safe-area-inset-bottom)) 14px;
  }

  .wrap { max-width: 520px; margin: 0 auto; }

  header { margin-bottom: 14px; }
  h1 {
    font-size: 19px; font-weight: 650; letter-spacing: .04em;
    margin: 0; text-transform: uppercase;
  }
  .sub { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .credit { color: var(--accent); }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .eticheta {
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--faint); font-weight: 600;
  }

  /* ---------------------------------------------------- extragerea curenta */
  #rezultat {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; align-items: center;
    min-height: 108px; margin-top: 10px;
  }
  #rezultat .gol { color: var(--faint); font-size: 14px; text-align: center; }

  /* mai multe grupe generate deodata: cate un rand pe grupa */
  #rezultat.grupe { display: block; max-height: 380px; overflow-y: auto; }
  .rand-grupa {
    display: flex; flex-wrap: wrap; align-items: center; gap: 5px;
    padding: 3px 0;
  }
  .rand-grupa .idx {
    color: var(--faint); font-size: 11px; min-width: 30px;
    font-variant-numeric: tabular-nums;
  }

  .bila {
    display: grid; place-items: center;
    border-radius: 50%; font-weight: 650;
    font-variant-numeric: tabular-nums;
    background: var(--gold);
    border: 1px solid var(--gold-line);
    color: var(--gold-text);
    animation: apare .32s cubic-bezier(.34, 1.56, .64, 1) backwards;
  }
  @keyframes apare {
    from { transform: scale(.3); opacity: 0; }
    to   { transform: scale(1);  opacity: 1; }
  }

  /* --------------------------------------------------------------- comenzi */
  .stepper {
    display: flex; align-items: center; gap: 10px;
    justify-content: space-between; margin-bottom: 12px;
  }
  .stepper .et { font-size: 15px; font-weight: 600; color: var(--text); }
  .stepper .grup { display: flex; align-items: center; gap: 4px; }

  .pas {
    --c1: #56627f; --c2: #363e56; --ink: #eef1f8; --cut: 8px;
    width: 46px; height: 46px; padding: 0;
    font-size: 24px; letter-spacing: 0;
  }

  #cate, #maxim, #pastreaza, #nrGrupe {
    width: 62px; height: 46px; border-radius: 12px;
    background: var(--sec); border: 1px solid var(--line);
    color: var(--text); font-size: 20px; font-weight: 650;
    text-align: center; font-family: inherit;
    -moz-appearance: textfield;
  }
  #cate::-webkit-outer-spin-button,
  #cate::-webkit-inner-spin-button,
  #maxim::-webkit-outer-spin-button,
  #maxim::-webkit-inner-spin-button,
  #pastreaza::-webkit-outer-spin-button,
  #pastreaza::-webkit-inner-spin-button,
  #nrGrupe::-webkit-outer-spin-button,
  #nrGrupe::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* ------------------------------------------------ butoane: forma comuna
     Colturi taiate, margine de relief jos, lumina sus si un model fin in dungi.
     Fiecare buton isi da doar culorile: --c1 (sus), --c2 (jos), --ink (text). */
  .pas, #genereaza, .sec-btn, .dlg-actiuni button {
    --cut: 11px;
    position: relative;
    border: none; cursor: pointer;
    font-family: "Chakra Petch", "Bahnschrift", "DIN Alternate", ui-monospace, monospace;
    font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
    line-height: 1.2;
    color: var(--ink, #fff);
    background:
      repeating-linear-gradient(135deg, rgba(255, 255, 255, .07) 0 2px, transparent 2px 8px),
      linear-gradient(180deg, var(--c1), var(--c2));
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
                       calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .30),
      inset 0 -4px 0 rgba(0, 0, 0, .32);
    text-shadow: 0 1px 1px rgba(0, 0, 0, .30);
    transition: transform .07s ease, filter .15s ease, box-shadow .07s ease;
  }
  .pas:hover, #genereaza:hover, .sec-btn:hover, .dlg-actiuni button:hover { filter: brightness(1.08); }
  .pas:active, #genereaza:active, .sec-btn:active, .dlg-actiuni button:active {
    transform: translateY(2px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .15),
      inset 0 -1px 0 rgba(0, 0, 0, .32),
      inset 0 3px 10px rgba(0, 0, 0, .28);
  }
  .pas:disabled, .sec-btn:disabled {
    filter: grayscale(.85) brightness(.75); opacity: .5;
    cursor: default; transform: none;
  }

  #genereaza {
    --c1: #2fcf6a; --c2: #15803d; --cut: 16px;
    width: 100%; padding: 20px 20px 23px;
    font-size: 22px; letter-spacing: .14em;
  }

  .secundare {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; margin-top: 10px;
  }
  .sec-btn {
    padding: 13px 8px 16px;
    font-size: 14px;
  }
  .sec-btn.lat { width: 100%; margin-top: 10px; }

  /* culori, pe familii: generare (verde, turcoaz), selectie (auriu, ca bilele),
     copiere (albastru), inapoi/inainte (indigo), stergere (caramiziu) */
  #toate       { --c1: #26b5a4; --c2: #0f7266; font-size: 16px; padding: 15px 8px 18px; }
  #selecteaza  { --c1: #e8b43a; --c2: #b27a12; --ink: #2a1b00; text-shadow: none; }
  #copiaza, #copiazaTot { --c1: #4a8fd0; --c2: #285e98; }
  #anuleaza, #refa      { --c1: #7477d4; --c2: #4b4ea3; }

  .nota { font-size: 12px; color: var(--dim); line-height: 1.45; }
  #notaSel { margin-top: 10px; }
  #notaGrupe { margin: -4px 0 12px; }
  #cardSel .stepper { margin: 12px 0 0; }

  /* RESET: acelasi corp de litera ca GENEREAZA, dar rosu */
  #reset {
    --c1: #bf6a60; --c2: #8c433b; --ink: #fff3f0; --cut: 14px;
    grid-column: 1 / -1;
    font-size: 19px; letter-spacing: .14em;
  }

  /* ----------------------------------------------------------------- bazin */
  .cap { display: flex; justify-content: space-between; align-items: baseline; }
  .contor { font-size: 12px; color: var(--dim); }

  .progres {
    height: 4px; border-radius: 2px; background: var(--line);
    margin: 10px 0 12px; overflow: hidden;
  }
  .progres div {
    height: 100%; background: var(--accent); width: 0;
    transition: width .35s ease;
  }

  #bazin {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
  }
  #bazin .n {
    aspect-ratio: 1; display: grid; place-items: center;
    border-radius: 50%; font-size: 14px; font-weight: 650;
    font-variant-numeric: tabular-nums;
    background: var(--free); border: 1px solid var(--free-line);
    color: var(--free-text);
    transition: background .25s ease, color .25s ease, border-color .25s ease;
  }
  #bazin .n.folosit {
    background: var(--used); border-color: var(--used-line); color: var(--used-text);
  }
  #bazin .n.nou {
    background: var(--gold); border-color: var(--gold-line); color: var(--gold-text);
  }
  #bazin .n.exclus {
    background: transparent; border: 1px dashed rgba(248, 113, 113, .5);
    color: rgba(248, 113, 113, .7); text-decoration: line-through;
  }
  #bazin.dens { gap: 4px; }
  #bazin.dens .n { font-size: 11px; }

  /* --------------------------------------------------------------- istoric */
  #istoric { margin-top: 10px; max-height: 210px; overflow-y: auto; }
  #istoric .rand {
    display: flex; gap: 10px; align-items: baseline;
    padding: 7px 0; border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  #istoric .rand:last-child { border-bottom: none; }
  #istoric .idx { color: var(--faint); font-size: 11px; min-width: 26px; }
  #istoric .ora { color: var(--dim); font-size: 11px; min-width: 86px; }
  #istoric .nums {
    color: var(--text); font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; letter-spacing: .04em;
  }
  #istoric .gol { color: var(--faint); font-size: 13px; padding: 8px 0; }

  #avert {
    display: none; background: #3a2a10; border: 1px solid #6b4d15;
    color: #f0c675; border-radius: 12px; padding: 10px 12px;
    font-size: 12px; margin-bottom: 12px; line-height: 1.45;
  }

  /* ---------------------------------------------------------------- dialog */
  #supra {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(8, 9, 12, .66);
    display: none; place-items: center; padding: 22px;
  }
  #supra.on { display: grid; }
  #dlg {
    width: 100%; max-width: 380px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 18px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, .5);
  }
  #dlgTxt { font-size: 15px; line-height: 1.5; margin-bottom: 16px; }
  .dlg-actiuni { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dlg-actiuni button {
    --c1: #56627f; --c2: #363e56;
    padding: 13px 8px 16px;
    font-size: 15px;
  }
  #dlgDa { --c1: #2fcf6a; --c2: #15803d; }
  #supra.simplu .dlg-actiuni { grid-template-columns: 1fr; }
  #supra.simplu #dlgNu { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Generator numere</h1>
    <div class="sub credit">generator f&#259;cut pentru &#537;i la cererea lui Diac Matei</div>
    <div class="sub" id="sub">1&ndash;49 &middot; f&#259;r&#259; grupe identice</div>
  </header>

  <div id="avert"></div>

  <div class="card">
    <div class="eticheta">Extragerea curent&#259;</div>
    <div id="rezultat"></div>
  </div>

  <div class="stepper">
    <span class="et">Din c&acirc;te numere</span>
    <div class="grup">
      <button class="pas" id="minusMax" aria-label="bazin mai mic">&minus;</button>
      <input id="maxim" type="number" inputmode="numeric" value="49" min="1" max="100">
      <button class="pas" id="plusMax" aria-label="bazin mai mare">+</button>
    </div>
  </div>

  <div class="card" id="cardSel">
    <span class="eticheta">Etapa 1 &middot; selec&#539;ie (op&#539;ional)</span>
    <div class="stepper">
      <span class="et">C&acirc;te p&#259;strez</span>
      <div class="grup">
        <button class="pas" id="minusPas" aria-label="pastrez mai putine">&minus;</button>
        <input id="pastreaza" type="number" inputmode="numeric" value="49" min="1" max="100">
        <button class="pas" id="plusPas" aria-label="pastrez mai multe">+</button>
      </div>
    </div>
    <button class="sec-btn lat" id="selecteaza"></button>
    <div class="nota" id="notaSel"></div>
  </div>

  <div class="stepper">
    <span class="et">C&acirc;te numere</span>
    <div class="grup">
      <button class="pas" id="minus" aria-label="mai putine">&minus;</button>
      <input id="cate" type="number" inputmode="numeric" value="6" min="1" max="49">
      <button class="pas" id="plus" aria-label="mai multe">+</button>
    </div>
  </div>
  <div class="stepper">
    <span class="et">C&acirc;te variante</span>
    <div class="grup">
      <button class="pas" id="minusGrupe" aria-label="mai putine variante">&minus;</button>
      <input id="nrGrupe" type="number" inputmode="numeric" value="9" min="1" max="1000">
      <button class="pas" id="plusGrupe" aria-label="mai multe variante">+</button>
    </div>
  </div>
  <div class="nota" id="notaGrupe"></div>

  <button id="genereaza">GENEREAZ&#258;</button>
  <button class="sec-btn lat" id="toate">Extrage variante</button>

  <div class="secundare">
    <button class="sec-btn" id="copiaza">Copiaz&#259; ultima extragere</button>
    <button class="sec-btn" id="copiazaTot">Copiaz&#259; tot istoricul</button>
    <button class="sec-btn" id="anuleaza">Un pas &#238;napoi</button>
    <button class="sec-btn" id="refa">Un pas &#238;nainte</button>
    <button class="sec-btn" id="reset">RESET</button>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="cap">
      <span class="eticheta">Bazin</span>
      <span class="contor" id="contor"></span>
    </div>
    <div class="progres"><div id="bara"></div></div>
    <div id="bazin"></div>
  </div>

  <div class="card">
    <div class="eticheta">Istoric</div>
    <div id="istoric"></div>
  </div>

</div>

<div id="supra" role="dialog" aria-modal="true">
  <div id="dlg">
    <div id="dlgTxt"></div>
    <div class="dlg-actiuni">
      <button id="dlgNu" type="button">Renun&#539;</button>
      <button id="dlgDa" type="button">Confirm&#259;</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var MIN_N = 1;              // primul numar din bazin
  var MAX_ABS = 100;          // cel mai mare bazin permis
  var MAX_IMPL = 49;          // bazinul implicit
  var MAX_GRUPE = 1000;       // cel mult atatea grupe la o apasare
  var LIMITA_ENUM = 250000;   // pana la atatea combinatii le putem numara pe toate

  var CHEIE = "generator_numere_v1";   // aceeasi cheie: salvarile vechi se incarca

  function stareNoua() {
    return {
      max: MAX_IMPL, cate: 6,
      grupe: 9,                // cate grupe face "Genereaza N grupe"
      pastreaza: MAX_IMPL,     // etapa 1: cate numere raman in selectie
      selectie: null,          // null = fara selectie, grupele se fac din 1..max
      evidentiaza: true, istoric: [],
      refacere: []             // pasii anulati, in ordine; "Un pas inainte" ia ultimul
    };
  }

  var stare = stareNoua();
  var stocareOk = true;

  function total() { return stare.max - MIN_N + 1; }
  function asc(a, b) { return a - b; }

  // Numerele din care se fac grupele: selectia, daca exista, altfel 1..max.
  function bazinCurent() {
    if (stare.selectie) return stare.selectie.slice();
    var out = [];
    for (var n = MIN_N; n <= stare.max; n++) out.push(n);
    return out;
  }
  function marime() { return stare.selectie ? stare.selectie.length : total(); }
  function cateEfectiv() { return Math.min(stare.cate, marime()); }

  // De cate ori a iesit fiecare numar din bazin, in toate grupele de pana acum.
  function numarari() {
    var c = new Map();
    bazinCurent().forEach(function (n) { c.set(n, 0); });
    stare.istoric.forEach(function (i) {
      i.numere.forEach(function (n) { if (c.has(n)) c.set(n, c.get(n) + 1); });
    });
    return c;
  }

  // "Disponibile" = numerele care au iesit cel mai rar. La inceput sunt toate;
  // dupa ce au iesit toate o data, se reia cu toate (runda noua).
  function ramase() {
    var c = numarari(), min = Infinity;
    c.forEach(function (v) { if (v < min) min = v; });
    return bazinCurent().filter(function (n) { return c.get(n) === min; });
  }

  function cheieGrupa(numere) { return numere.slice().sort(asc).join(","); }

  // C(n, k), oprit la "Infinity" cand trece de limita (nu avem nevoie de mai mult)
  function combinari(n, k) {
    if (k < 0 || k > n) return 0;
    k = Math.min(k, n - k);
    var r = 1;
    for (var i = 1; i <= k; i++) {
      r = r * (n - k + i) / i;
      if (r > LIMITA_ENUM) return Infinity;
    }
    return Math.round(r);
  }

  // Grupele distincte de marimea "cate" care exista deja in istoric
  function cheiExistente(cate) {
    var s = new Set();
    stare.istoric.forEach(function (i) {
      if (i.numere.length === cate) s.add(cheieGrupa(i.numere));
    });
    return s;
  }

  // Intrarile din istoric adaugate de ultima actiune. "Genereaza N grupe"
  // pune acelasi "lot" pe toate grupele, ca "Un pas inapoi" sa le scoata impreuna.
  function ultimeleIntrari() {
    var ist = stare.istoric;
    if (!ist.length) return [];
    var ultima = ist[ist.length - 1];
    if (ultima.lot == null) return [ultima];
    var i = ist.length - 1;
    while (i > 0 && ist[i - 1].lot === ultima.lot) i--;
    return ist.slice(i);
  }

  // "20 de grupe", "16 grupe", "o grupa"
  function plural(n, unu, multe) {
    if (n === 1) return unu;
    var r = n % 100;
    return n + (r === 0 || r >= 20 ? " de " : " ") + multe;
  }

  // ------------------------------------------------------------ persistenta
  function incarca() {
    var brut;
    try {
      brut = localStorage.getItem(CHEIE);
    } catch (e) {
      stocareOk = false;                  // storage blocat de browser
      return;
    }
    if (!brut) return;
    try {
      var d = JSON.parse(brut);
      stare.max = (Number.isInteger(d.max) && d.max >= 1 && d.max <= MAX_ABS)
        ? d.max : MAX_IMPL;               // salvarile vechi nu au "max"
      stare.cate = (Number.isInteger(d.cate) && d.cate >= 1 && d.cate <= stare.max)
        ? d.cate : Math.min(6, stare.max);
      stare.pastreaza = (Number.isInteger(d.pastreaza) && d.pastreaza >= 1 && d.pastreaza <= stare.max)
        ? d.pastreaza : stare.max;        // salvarile vechi nu au "pastreaza"

      var sel = [], vazut = new Set();
      (Array.isArray(d.selectie) ? d.selectie : []).forEach(function (n) {
        if (Number.isInteger(n) && n >= MIN_N && n <= stare.max && !vazut.has(n)) {
          vazut.add(n); sel.push(n);
        }
      });
      stare.selectie = sel.length ? sel.sort(asc) : null;

      stare.grupe = (Number.isInteger(d.grupe) && d.grupe >= 1 && d.grupe <= MAX_GRUPE)
        ? d.grupe : Math.ceil(marime() / cateEfectiv());   // salvarile vechi nu au "grupe"

      var inBazin = new Set(bazinCurent());
      stare.istoric = (Array.isArray(d.istoric) ? d.istoric : []).filter(function (i) {
        return i && Array.isArray(i.numere) && i.numere.length &&
          i.numere.every(function (n) { return inBazin.has(n); });
      });
      stare.evidentiaza = d.evidentiaza !== false;
      stare.refacere = (Array.isArray(d.refacere) ? d.refacere : []).filter(function (p) {
        if (!p) return false;
        if (p.tip === "selectie") return Array.isArray(p.selectie) && p.selectie.length > 0;
        return p.tip === "grupe" && Array.isArray(p.intrari) && p.intrari.length > 0 &&
          p.intrari.every(function (i) { return i && Array.isArray(i.numere); });
      });
    } catch (e) {
      stare = stareNoua();
    }
  }

  function salveaza() {
    try {
      localStorage.setItem(CHEIE, JSON.stringify(stare));
    } catch (e) {
      if (stocareOk) {
        stocareOk = false;
        avertizeaza();
      }
    }
  }

  function avertizeaza() {
    var el = document.getElementById("avert");
    el.textContent =
      "Browserul nu permite salvarea pe disc aici. Aplicatia merge, dar " +
      "numerele consumate se pierd la inchiderea paginii. Deschide fisierul " +
      "de pe o adresa http/https, nu direct din memoria telefonului.";
    el.style.display = "block";
  }

  // ------------------------------------------------------- dialog in pagina
  // Nu folosim window.confirm / window.alert: browserul le poate bloca (bifa
  // "nu mai afisa dialoguri", moduri standalone, extensii). Cand sunt blocate,
  // confirm() returneaza false in tacere si butoanele par moarte.
  var raspunde = null;

  function inchideDlg(da) {
    document.getElementById("supra").classList.remove("on");
    var cb = raspunde;
    raspunde = null;
    if (cb) cb(da);
  }

  function intreaba(text, cb) {
    var supra = document.getElementById("supra");
    document.getElementById("dlgTxt").textContent = text;
    document.getElementById("dlgDa").textContent = "Confirm\u0103";
    supra.classList.remove("simplu");
    supra.classList.add("on");
    raspunde = cb;
    document.getElementById("dlgDa").focus();
  }

  function spune(text, cb) {
    var supra = document.getElementById("supra");
    document.getElementById("dlgTxt").textContent = text;
    document.getElementById("dlgDa").textContent = "OK";
    supra.classList.add("simplu");
    supra.classList.add("on");
    raspunde = cb || null;               // ruleaza si la OK, si la Escape/fundal
    document.getElementById("dlgDa").focus();
  }

  // --------------------------------------------------- aleator criptografic
  function intAleator(limita) {            // 0 .. limita-1, fara bias
    var max = Math.floor(4294967296 / limita) * limita;
    var buf = new Uint32Array(1);
    var v;
    do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= max);
    return v % limita;
  }

  function amesteca(arr) {                 // Fisher-Yates complet, pe o copie
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = intAleator(i + 1);
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function extrage(bazin, cate) {          // "cate" numere diferite, sortate
    return amesteca(bazin).slice(0, Math.min(cate, bazin.length)).sort(asc);
  }

  // ------------------------------------------------ o grupa noua, echilibrata
  // Regula: intai numerele iesite cel mai rar, apoi se completeaza aleator din
  // urmatoarele. Asa, din 25 cu grupe de 6: grupele 1-4 folosesc 24 de numere,
  // grupa 5 ia numarul ramas + 5 dintre cele deja iesite, si tot asa la infinit.
  // Nicio grupa nu poate fi identica cu una de dinainte.
  function grupaNoua(bazin, cate, contari, existente) {
    for (var t = 0; t < 80; t++) {
      // amestecare + sortare stabila dupa numarari = aleator in cadrul aceleiasi numarari
      var ordine = amesteca(bazin).sort(function (a, b) { return contari.get(a) - contari.get(b); });
      var g = ordine.slice(0, cate).sort(asc);
      if (!existente.has(g.join(","))) return g;
    }
    // Varianta echilibrata e deja folosita (se intampla doar in bazine mici):
    // alegem, dintre toate grupele nefolosite, una cat mai echilibrata.
    if (combinari(bazin.length, cate) <= LIMITA_ENUM) {
      return celMaiEchilibrat(bazin, cate, contari, existente);
    }
    for (t = 0; t < 2000; t++) {
      var r = extrage(bazin, cate);
      if (!existente.has(r.join(","))) return r;
    }
    return null;
  }

  function celMaiEchilibrat(bazin, cate, contari, existente) {
    var s = bazin.slice().sort(asc), n = s.length, idx = [], i;
    var best = Infinity, ales = null, egale = 0;
    for (i = 0; i < cate; i++) idx.push(i);
    while (true) {
      var g = idx.map(function (k) { return s[k]; });
      if (!existente.has(g.join(","))) {
        var scor = 0;
        for (i = 0; i < cate; i++) scor += contari.get(g[i]);
        if (scor < best) { best = scor; ales = g; egale = 1; }
        else if (scor === best && intAleator(++egale) === 0) ales = g;   // la egalitate, aleator
      }
      var p = cate - 1;                    // urmatoarea combinatie
      while (p >= 0 && idx[p] === n - cate + p) p--;
      if (p < 0) break;
      idx[p]++;
      for (i = p + 1; i < cate; i++) idx[i] = idx[i - 1] + 1;
    }
    return ales;
  }

  // Face pana la "cate grupe" noi. Intoarce grupele facute (pot fi mai putine
  // doar daca s-au terminat toate combinatiile posibile).
  function faGrupe(nr) {
    var bazin = bazinCurent(), cate = cateEfectiv();
    var contari = numarari(), existente = cheiExistente(cate);
    var posibile = combinari(bazin.length, cate), out = [];
    for (var g = 0; g < nr; g++) {
      if (existente.size >= posibile) break;
      var grupa = grupaNoua(bazin, cate, contari, existente);
      if (!grupa) break;
      existente.add(grupa.join(","));
      grupa.forEach(function (n) { contari.set(n, contari.get(n) + 1); });
      out.push(grupa);
    }
    return out;
  }

  function mesajEpuizat(facute, cerute) {
    var pos = combinari(marime(), cateEfectiv());
    spune((facute ? "Am putut extrage doar " + plural(facute, "o variant\u0103", "variante") + " din " + cerute + ". " : "") +
          (pos === 1 ? "Singura grup\u0103 posibil\u0103 (toate cele " + marime() + " numere) a fost deja generat\u0103."
                     : "Toate cele " + plural(pos, "", "grupe") + " diferite de c\u00e2te " + cateEfectiv() +
                       " din " + marime() + " numere au fost deja generate."));
  }

  // ------------------------------------------------------ etapa 1: selectia
  function selecteaza() {
    var k = parseInt(document.getElementById("pastreaza").value, 10);
    if (!Number.isInteger(k) || k < 1) {
      spune("Introdu un num\u0103r \u00eentreg, cel pu\u021bin 1.");
      return;
    }
    k = Math.min(k, total());
    stare.pastreaza = k;

    var ceva = stare.selectie || stare.istoric.length;

    if (k === total()) {                   // butonul arata "Renunta la selectie"
      if (!stare.selectie) {
        salveaza(); deseneaza();
        spune("\u201eC\u00e2te p\u0103strez\u201d este " + k + ", adic\u0103 toate numerele, deci nu e nimic de exclus. " +
              "Scade valoarea cu butonul \u2212 (de exemplu la 25), apoi apas\u0103 din nou.");
        return;
      }
      intreaba("Renun\u021b la selec\u021bie \u0219i revin la toate numerele 1\u2013" +
               stare.max + ". Grupele de p\u00e2n\u0103 acum se \u0219terg. Continui?",
        function (da) {
          if (da) { stare.selectie = null; stare.istoric = []; stare.refacere = []; }
          stare.evidentiaza = true;
          salveaza(); deseneaza();
        });
      return;
    }

    function fa() {
      stare.refacere = [];
      stare.selectie = extrage(bazinTotal(), k);
      stare.istoric = [];
      stare.evidentiaza = true;
      if (stare.cate > k) stare.cate = k;
      if (navigator.vibrate) navigator.vibrate(18);
      salveaza(); deseneaza();
    }

    if (ceva) {
      intreaba("Extrag " + k + " din 1\u2013" + stare.max +
               ". Selec\u021bia \u0219i grupele de p\u00e2n\u0103 acum se \u0219terg. Continui?",
        function (da) { if (da) fa(); else deseneaza(); });
      return;
    }
    fa();
  }

  function bazinTotal() {
    var out = [];
    for (var n = MIN_N; n <= stare.max; n++) out.push(n);
    return out;
  }

  // ------------------------------------------------------- etapa 2: grupele
  function citeste(id) {
    var v = parseInt(document.getElementById(id).value, 10);
    if (!Number.isInteger(v) || v < 1) {
      spune("Introdu un num\u0103r \u00eentreg, cel pu\u021bin 1.");
      return null;
    }
    return v;
  }

  function adauga(grupe, lot) {
    var ora = acum();
    grupe.forEach(function (g) {
      var intrare = { ora: ora, numere: g };
      if (lot != null) intrare.lot = lot;
      stare.istoric.push(intrare);
    });
    stare.refacere = [];
    stare.evidentiaza = true;
    if (navigator.vibrate) navigator.vibrate(18);
    salveaza();
    deseneaza();
  }

  function genereaza() {
    var cate = citeste("cate");
    if (cate === null) return;
    stare.cate = Math.min(cate, marime());
    var grupe = faGrupe(1);
    if (!grupe.length) { deseneaza(); mesajEpuizat(0, 1); return; }
    adauga(grupe, null);
  }

  function genereazaToate() {
    var cate = citeste("cate"), nr = citeste("nrGrupe");
    if (cate === null || nr === null) return;
    stare.cate = Math.min(cate, marime());
    stare.grupe = Math.min(nr, MAX_GRUPE);
    var grupe = faGrupe(stare.grupe);
    if (grupe.length) adauga(grupe, Date.now());
    else deseneaza();
    if (grupe.length < stare.grupe) mesajEpuizat(grupe.length, stare.grupe);
  }

  // ----------------------------------------------------------------- setari
  function schimbaMax(nou) {
    if (!Number.isInteger(nou)) { deseneaza(); return; }
    nou = Math.min(MAX_ABS, Math.max(1, nou));
    if (nou === stare.max) { deseneaza(); return; }

    // Bazinul, selectia si istoricul apartin unei anumite marimi. Daca s-a
    // extras deja ceva, schimbarea marimii porneste de la zero.
    if (stare.selectie || stare.istoric.length) {
      intreaba("Schimb bazinul la 1\u2013" + nou +
               ". Selec\u021bia \u0219i extragerile de p\u00e2n\u0103 acum se \u0219terg. Continui?",
        function (da) {
          if (!da) { deseneaza(); return; }
          stare.selectie = null; stare.istoric = [];
          aplicaMax(nou);
        });
      return;
    }

    aplicaMax(nou);
  }

  function aplicaMax(nou) {
    var pastraToate = stare.pastreaza >= stare.max;
    stare.max = nou;
    stare.refacere = [];                      // pasii anulati tin de bazinul vechi
    if (pastraToate || stare.pastreaza > nou) stare.pastreaza = nou;
    if (stare.cate > nou) stare.cate = nou;   // nu poti cere mai multe decat exista
    salveaza();
    deseneaza();
  }

  function anuleaza() {
    if (stare.istoric.length === 0) {
      if (stare.selectie) {                 // primul pas facut a fost selectia
        stare.refacere.push({ tip: "selectie", selectie: stare.selectie });
        stare.selectie = null;
        stare.evidentiaza = true;
        salveaza(); deseneaza();
        return;
      }
      spune("Nu exist\u0103 nicio extragere.");
      return;
    }
    var scoase = ultimeleIntrari();
    stare.refacere.push({ tip: "grupe", intrari: scoase });
    stare.istoric.splice(stare.istoric.length - scoase.length, scoase.length);
    stare.evidentiaza = true;
    salveaza();
    deseneaza();
  }

  function refa() {
    var pas = stare.refacere[stare.refacere.length - 1];
    if (!pas) return;

    // Verificare de siguranta: pasul trebuie sa se potriveasca cu starea de acum.
    var valid;
    if (pas.tip === "selectie") {
      valid = !stare.selectie && !stare.istoric.length &&
        pas.selectie.every(function (n) { return Number.isInteger(n) && n >= MIN_N && n <= stare.max; });
    } else {
      var inBazin = new Set(bazinCurent());
      var chei = new Set(stare.istoric.map(function (i) { return cheieGrupa(i.numere); }));
      valid = pas.intrari.every(function (i) {
        return i.numere.every(function (n) { return inBazin.has(n); }) && !chei.has(cheieGrupa(i.numere));
      });
    }
    if (!valid) {
      stare.refacere = [];
      salveaza(); deseneaza();
      spune("Pasul nu mai poate fi ref\u0103cut.");
      return;
    }

    stare.refacere.pop();
    if (pas.tip === "selectie") {
      stare.selectie = pas.selectie.slice();
      if (stare.cate > stare.selectie.length) stare.cate = stare.selectie.length;
    } else {
      pas.intrari.forEach(function (i) { stare.istoric.push(i); });
    }
    stare.evidentiaza = true;
    if (navigator.vibrate) navigator.vibrate(18);
    salveaza();
    deseneaza();
  }

  function reset() {
    // "max", "cate", "grupe" si "pastreaza" raman; selectia se sterge, ca la pornire
    stare.selectie = null; stare.istoric = []; stare.refacere = [];
    stare.evidentiaza = true;
    salveaza();
    deseneaza();
  }

  // ----------------------------------------------------------------- copiere
  function copiazaUltima() {
    copiazaText("copiaza", ultimeleIntrari().map(function (i) {
      return i.numere.join("  ");
    }).join("\n"));
  }

  function descriereSelectie(listaMax) {
    if (!stare.selectie) return "";
    var inSel = new Set(stare.selectie), excluse = [];
    for (var n = MIN_N; n <= stare.max; n++) if (!inSel.has(n)) excluse.push(n);
    var txt = "Selec\u021bie: " + stare.selectie.length + " din 1\u2013" + stare.max + ".";
    var scurta = excluse.length <= stare.selectie.length;   // arata lista mai scurta
    var lista = scurta ? excluse : stare.selectie;
    if (lista.length && lista.length <= listaMax) {
      txt += (scurta ? (excluse.length === 1 ? " Exclus: " : " Excluse: ")
                     : " P\u0103strate: ") + lista.join("  ");
    }
    return txt;
  }

  function copiazaTot() {
    // Aceeasi ordine ca in lista Istoric: cea mai recenta extragere prima.
    // Selectia s-a facut inaintea tuturor grupelor, deci sta la final.
    var linii = stare.istoric.slice().reverse().map(function (intrare) {
      return intrare.numere.join("  ");
    });
    if (stare.selectie) linii.push(descriereSelectie(Infinity));
    copiazaText("copiazaTot", linii.join("\n"));
  }

  function copiazaText(idButon, txt) {
    if (!txt) { spune("Nu exist\u0103 nicio extragere de copiat."); return; }

    if (navigator.clipboard) {
      navigator.clipboard.writeText(txt).catch(function () { copiazaVechi(txt); });
    } else {
      copiazaVechi(txt);
    }

    var b = document.getElementById(idButon);
    if (b.getAttribute("data-text") === null) b.setAttribute("data-text", b.textContent);
    b.textContent = "Copiat";
    clearTimeout(b.tempo);
    b.tempo = setTimeout(function () { b.textContent = b.getAttribute("data-text"); }, 1200);
  }

  function copiazaVechi(txt) {
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) { /* ignor */ }
    document.body.removeChild(ta);
  }

  function acum() {
    var d = new Date(), p = function (x) { return String(x).padStart(2, "0"); };
    return p(d.getDate()) + "." + p(d.getMonth() + 1) + "." + d.getFullYear() +
           " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  // ----------------------------------------------------------------- afisare
  function bila(num, dim, intarziere) {
    var b = document.createElement("div");
    b.className = "bila";
    b.textContent = num;
    b.style.width = dim + "px";
    b.style.height = dim + "px";
    b.style.fontSize = Math.round(dim * 0.42) + "px";
    b.style.animationDelay = intarziere + "ms";
    return b;
  }

  function textNotaGrupe(disp) {
    var a = disp.length, c = cateEfectiv(), n = marime();
    var intregi = Math.floor(a / c), rest = a % c, lipsa = c - rest, txt;
    var completare = lipsa === 1 ? "unul deja extras" : lipsa + " deja extrase";

    if (c === n) {
      txt = "Fiecare grup\u0103 are toate cele " + n + " numere.";
    } else if (rest === 0) {
      txt = "Disponibile: " + a + ", adic\u0103 " +
            (intregi === 1 ? "o grup\u0103 de " + c : plural(intregi, "", "grupe") + " de c\u00e2te " + c) +
            ". Apoi se reia cu toate numerele.";
    } else if (intregi > 0) {
      txt = "Disponibile: " + a + ", adic\u0103 " +
            (intregi === 1 ? "o grup\u0103 de " + c : plural(intregi, "", "grupe") + " de c\u00e2te " + c) +
            ". Grupa a " + (intregi + 1) + "-a ia " +
            (rest === 1 ? "num\u0103rul r\u0103mas" : "cele " + rest + " r\u0103mase") +
            " \u0219i completeaz\u0103 cu " + completare + ".";
    } else {
      txt = "Disponibile: " + a + ". Grupa urm\u0103toare " +
            (rest === 1 ? "\u00eel ia" : "le ia") + " \u0219i completeaz\u0103 cu " + completare + ".";
    }

    var pos = combinari(n, c);
    if (pos <= 1000) {
      txt += " Grupe diferite posibile: " + pos + ", r\u0103mase: " + (pos - cheiExistente(c).size) + ".";
    }
    return txt;
  }

  function deseneaza() {
    var disp = ramase(), inDisp = new Set(disp),
        ultimele = stare.evidentiaza ? ultimeleIntrari() : [],
        noi = new Set(), inSel = stare.selectie ? new Set(stare.selectie) : null;
    ultimele.forEach(function (i) { i.numere.forEach(function (n) { noi.add(n); }); });

    // "Extragerea curenta" se reconstruieste doar cand se schimba. Altfel
    // bilele ar reporni animatia la fiecare redesenare.
    var rez = document.getElementById("rezultat");
    var cheie = !stare.evidentiaza ? "-" :
      (stare.selectie ? "s" : "") + stare.istoric.length + ":" +
      ultimele.map(function (i) { return i.numere.join(","); }).join("|");
    if (rez.getAttribute("data-afisat") !== cheie) {
      rez.setAttribute("data-afisat", cheie);
      rez.innerHTML = "";
      rez.classList.toggle("grupe", ultimele.length > 1);
      rez.scrollTop = 0;

      if (stare.evidentiaza && !ultimele.length) {
        rez.innerHTML = stare.selectie
          ? '<span class="gol">selec\u021bia e gata, apas\u0103 GENEREAZ\u0102</span>'
          : '<span class="gol">apas\u0103 GENEREAZ\u0102</span>';
      } else if (ultimele.length === 1) {
        var n = ultimele[0].numere.length;
        var dim = n <= 6 ? 58 : n <= 12 ? 46 : n <= 24 ? 36 : 28;
        ultimele[0].numere.forEach(function (num, i) {
          rez.appendChild(bila(num, dim, i * 55));
        });
      } else if (ultimele.length > 1) {
        var lung = Math.max.apply(null, ultimele.map(function (i) { return i.numere.length; }));
        var d2 = lung <= 8 ? 32 : lung <= 12 ? 26 : 22;
        var start = stare.istoric.length - ultimele.length;
        ultimele.forEach(function (intrare, g) {
          var rand = document.createElement("div");
          rand.className = "rand-grupa";
          var idx = document.createElement("span");
          idx.className = "idx";
          idx.textContent = "#" + (start + g + 1);
          rand.appendChild(idx);
          intrare.numere.forEach(function (num) {
            rand.appendChild(bila(num, d2, Math.min(g, 12) * 40));
          });
          rez.appendChild(rand);
        });
      }
    }

    // bazin (se reconstruieste doar cand se schimba marimea)
    var bazin = document.getElementById("bazin");
    if (bazin.children.length !== total()) {
      bazin.innerHTML = "";
      for (var k = MIN_N; k <= stare.max; k++) {
        var c = document.createElement("div");
        c.className = "n"; c.textContent = k;
        bazin.appendChild(c);
      }
      var coloane = total() > 49 ? 10 : 7;
      bazin.style.gridTemplateColumns = "repeat(" + coloane + ", 1fr)";
      bazin.classList.toggle("dens", coloane === 10);
    }
    for (var i = 0; i < total(); i++) {
      var num = MIN_N + i, el = bazin.children[i];
      el.className = "n" + (inSel && !inSel.has(num) ? " exclus"
                          : noi.has(num) ? " nou"
                          : !inDisp.has(num) ? " folosit" : "");
    }

    // subtitlu, contor si progres
    document.getElementById("sub").textContent =
      "1\u2013" + stare.max +
      (stare.selectie ? " \u00b7 selec\u021bie de " + stare.selectie.length : "") +
      " \u00b7 f\u0103r\u0103 grupe identice";
    document.getElementById("contor").textContent =
      disp.length + (disp.length === 1 ? " disponibil \u00b7 " : " disponibile \u00b7 ") +
      plural(stare.istoric.length, "o extragere", "extrageri").replace(/^0 de /, "0 ");
    document.getElementById("bara").style.width =
      ((marime() - disp.length) / marime() * 100) + "%";

    // limite steppere
    document.getElementById("maxim").value = stare.max;

    // "Cate numere" arata alegerea utilizatorului, nu cate au mai ramas.
    var camp = document.getElementById("cate");
    camp.max = marime();
    camp.value = stare.cate;

    var campG = document.getElementById("nrGrupe");
    campG.max = MAX_GRUPE;
    campG.value = stare.grupe;
    document.getElementById("toate").textContent =
      "Extrage " + plural(stare.grupe, "o variant\u0103", "variante");

    var campP = document.getElementById("pastreaza");
    campP.max = total();
    if (document.activeElement !== campP || parseInt(campP.value, 10) !== stare.pastreaza) {
      campP.value = stare.pastreaza;
    }

    // etapa 1: butonul spune exact ce face
    var btn = document.getElementById("selecteaza"), nota = document.getElementById("notaSel");
    if (stare.pastreaza >= total()) {
      btn.textContent = stare.selectie ? "Renun\u021b\u0103 la selec\u021bie" : "Extrage " + total() + " din " + total();
      btn.disabled = false;
    } else {
      btn.textContent = (stare.selectie ? "Selec\u021bie nou\u0103: " : "Extrage ") +
                        stare.pastreaza + " din " + total();
      btn.disabled = false;
    }
    if (stare.selectie) {
      nota.textContent = descriereSelectie(15);
    } else if (stare.pastreaza < total()) {
      nota.textContent = "P\u0103strezi " + stare.pastreaza + ", excluzi " +
                         (total() - stare.pastreaza) + ", la \u00eent\u00e2mplare. " +
                         "Grupele se fac apoi doar din cele p\u0103strate.";
    } else {
      nota.textContent = "F\u0103r\u0103 selec\u021bie, grupele se fac din toate numerele. " +
                         "Scade \u201eC\u00e2te p\u0103strez\u201d ca s\u0103 excluzi numere la \u00eent\u00e2mplare.";
    }

    document.getElementById("notaGrupe").textContent = textNotaGrupe(disp);
    document.getElementById("refa").disabled = !stare.refacere.length;

    // istoric
    var ist = document.getElementById("istoric");
    ist.innerHTML = "";
    if (!stare.istoric.length) {
      ist.innerHTML = '<div class="gol">nicio extragere \u00eenc\u0103</div>';
    } else {
      var html = [];
      for (var j = stare.istoric.length - 1; j >= 0; j--) {
        var intrare = stare.istoric[j];
        html.push('<div class="rand"><span class="idx">#' + (j + 1) + '</span>' +
                  '<span class="ora">' + intrare.ora + '</span>' +
                  '<span class="nums">' + intrare.numere.join("  ") + '</span></div>');
      }
      ist.innerHTML = html.join("");
    }
  }

  function ajusteaza(cheie, idCamp, delta, limita) {
    var v = parseInt(document.getElementById(idCamp).value, 10);
    if (!Number.isInteger(v)) v = stare[cheie];
    stare[cheie] = Math.min(limita(), Math.max(1, v + delta));
    salveaza();
    deseneaza();
  }

  // ------------------------------------------------------------------ pornire
  function pe(id, ev, fn) { document.getElementById(id).addEventListener(ev, fn); }
  function maxGrupe() { return MAX_GRUPE; }

  pe("genereaza", "click", genereaza);
  pe("toate", "click", genereazaToate);
  pe("minus", "click", function () { ajusteaza("cate", "cate", -1, marime); });
  pe("plus", "click", function () { ajusteaza("cate", "cate", 1, marime); });
  pe("cate", "change", function () { ajusteaza("cate", "cate", 0, marime); });
  pe("minusGrupe", "click", function () { ajusteaza("grupe", "nrGrupe", -1, maxGrupe); });
  pe("plusGrupe", "click", function () { ajusteaza("grupe", "nrGrupe", 1, maxGrupe); });
  pe("nrGrupe", "change", function () { ajusteaza("grupe", "nrGrupe", 0, maxGrupe); });
  pe("minusPas", "click", function () { ajusteaza("pastreaza", "pastreaza", -1, total); });
  pe("plusPas", "click", function () { ajusteaza("pastreaza", "pastreaza", 1, total); });
  pe("pastreaza", "change", function () { ajusteaza("pastreaza", "pastreaza", 0, total); });
  pe("pastreaza", "input", function () {       // butonul arata valoarea noua inca din timpul scrierii
    var v = parseInt(this.value, 10);
    if (Number.isInteger(v) && v >= 1 && v <= total() && v !== stare.pastreaza) {
      stare.pastreaza = v;
      salveaza();
      deseneaza();
    }
  });
  pe("selecteaza", "click", selecteaza);
  pe("minusMax", "click", function () { schimbaMax(stare.max - 1); });
  pe("plusMax", "click", function () { schimbaMax(stare.max + 1); });
  pe("maxim", "change", function () { schimbaMax(parseInt(this.value, 10)); });
  pe("copiaza", "click", copiazaUltima);
  pe("copiazaTot", "click", copiazaTot);
  pe("anuleaza", "click", anuleaza);
  pe("refa", "click", refa);
  pe("reset", "click", reset);

  pe("dlgDa", "click", function () { inchideDlg(true); });
  pe("dlgNu", "click", function () { inchideDlg(false); });
  pe("supra", "click", function (e) { if (e.target === this) inchideDlg(false); });
  document.addEventListener("keydown", function (e) {
    if (!document.getElementById("supra").classList.contains("on")) return;
    if (e.key === "Escape") { e.preventDefault(); inchideDlg(false); }
    else if (e.key === "Enter") { e.preventDefault(); inchideDlg(true); }
  });

  incarca();
  if (!stocareOk) avertizeaza();
  deseneaza();
})();
</script>
</body>
</html>
