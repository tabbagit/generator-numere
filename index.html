<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#15161c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Generator numere</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2315161c'/%3E%3Ccircle cx='90' cy='90' r='52' fill='%23f0b429'/%3E%3Ctext x='90' y='90' font-family='Segoe UI,sans-serif' font-size='54' font-weight='700' fill='%23241a00' text-anchor='middle' dominant-baseline='central'%3E49%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #15161c;
    --panel: #1e2029;
    --line: #2b2e3a;
    --text: #e6e8ef;
    --dim: #8b90a3;
    --faint: #5a5f72;
    --accent: #16a34a;
    --accent-hi: #1fbe59;
    --sec: #282b36;
    --sec-hi: #343846;
    --free: #2f3342;
    --free-line: #3d4256;
    --free-text: #c9cee0;
    --used: #1a1c24;
    --used-line: #22252f;
    --used-text: #464b5c;
    --gold: #f0b429;
    --gold-line: #ffcf5c;
    --gold-text: #241a00;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }

  body {
    padding: max(14px, env(safe-area-inset-top)) 14px
             max(14px, env(safe-area-inset-bottom)) 14px;
  }

  .wrap { max-width: 520px; margin: 0 auto; }

  header { margin-bottom: 14px; }
  h1 {
    font-size: 19px; font-weight: 650; letter-spacing: .04em;
    margin: 0; text-transform: uppercase;
  }
  .sub { font-size: 12px; color: var(--dim); margin-top: 2px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .eticheta {
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--faint); font-weight: 600;
  }

  /* ---------------------------------------------------- extragerea curenta */
  #rezultat {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; align-items: center;
    min-height: 108px; margin-top: 10px;
  }
  #rezultat .gol { color: var(--faint); font-size: 14px; }

  .bila {
    display: grid; place-items: center;
    border-radius: 50%; font-weight: 650;
    font-variant-numeric: tabular-nums;
    background: var(--gold);
    border: 1px solid var(--gold-line);
    color: var(--gold-text);
    animation: apare .32s cubic-bezier(.34, 1.56, .64, 1) backwards;
  }
  @keyframes apare {
    from { transform: scale(.3); opacity: 0; }
    to   { transform: scale(1);  opacity: 1; }
  }

  /* --------------------------------------------------------------- comenzi */
  .stepper {
    display: flex; align-items: center; gap: 10px;
    justify-content: space-between; margin-bottom: 12px;
  }
  .stepper .et { font-size: 15px; font-weight: 600; color: var(--text); }
  .stepper .grup { display: flex; align-items: center; gap: 4px; }

  .pas {
    width: 46px; height: 46px; border-radius: 12px;
    background: var(--sec); border: none; color: var(--text);
    font-size: 22px; font-weight: 600; cursor: pointer;
  }
  .pas:active { background: var(--sec-hi); }
  .pas:disabled { opacity: .35; }

  #cate, #maxim {
    width: 62px; height: 46px; border-radius: 12px;
    background: var(--sec); border: 1px solid var(--line);
    color: var(--text); font-size: 20px; font-weight: 650;
    text-align: center; font-family: inherit;
    -moz-appearance: textfield;
  }
  #cate::-webkit-outer-spin-button,
  #cate::-webkit-inner-spin-button,
  #maxim::-webkit-outer-spin-button,
  #maxim::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  #genereaza {
    width: 100%; padding: 20px; border: none; border-radius: 16px;
    background: var(--accent); color: #fff;
    font-size: 19px; font-weight: 700; letter-spacing: .06em;
    font-family: inherit; cursor: pointer;
    box-shadow: 0 4px 16px rgba(22, 163, 74, .28);
    transition: transform .08s ease, background .15s ease;
  }
  #genereaza:active { transform: scale(.975); background: var(--accent-hi); }

  .secundare {
    display: grid; grid-template-columns: 1fr 1.3fr 1fr;
    gap: 8px; margin-top: 10px;
  }
  .sec-btn {
    padding: 14px 8px; border: none; border-radius: 12px;
    background: var(--sec); color: var(--text);
    font-size: 15px; font-weight: 600; letter-spacing: .01em;
    line-height: 1.25; font-family: inherit; cursor: pointer;
  }
  .sec-btn:active { background: var(--sec-hi); }

  /* ----------------------------------------------------------------- bazin */
  .cap { display: flex; justify-content: space-between; align-items: baseline; }
  .contor { font-size: 12px; color: var(--dim); }

  .progres {
    height: 4px; border-radius: 2px; background: var(--line);
    margin: 10px 0 12px; overflow: hidden;
  }
  .progres div {
    height: 100%; background: var(--accent); width: 0;
    transition: width .35s ease;
  }

  #bazin {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
  }
  #bazin .n {
    aspect-ratio: 1; display: grid; place-items: center;
    border-radius: 50%; font-size: 14px; font-weight: 650;
    font-variant-numeric: tabular-nums;
    background: var(--free); border: 1px solid var(--free-line);
    color: var(--free-text);
    transition: background .25s ease, color .25s ease, border-color .25s ease;
  }
  #bazin .n.folosit {
    background: var(--used); border-color: var(--used-line); color: var(--used-text);
  }
  #bazin .n.nou {
    background: var(--gold); border-color: var(--gold-line); color: var(--gold-text);
  }
  #bazin.dens { gap: 4px; }
  #bazin.dens .n { font-size: 11px; }

  /* --------------------------------------------------------------- istoric */
  #istoric { margin-top: 10px; max-height: 210px; overflow-y: auto; }
  #istoric .rand {
    display: flex; gap: 10px; align-items: baseline;
    padding: 7px 0; border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  #istoric .rand:last-child { border-bottom: none; }
  #istoric .idx { color: var(--faint); font-size: 11px; min-width: 26px; }
  #istoric .ora { color: var(--dim); font-size: 11px; min-width: 86px; }
  #istoric .nums {
    color: var(--text); font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; letter-spacing: .04em;
  }
  #istoric .gol { color: var(--faint); font-size: 13px; padding: 8px 0; }

  #avert {
    display: none; background: #3a2a10; border: 1px solid #6b4d15;
    color: #f0c675; border-radius: 12px; padding: 10px 12px;
    font-size: 12px; margin-bottom: 12px; line-height: 1.45;
  }

  /* ---------------------------------------------------------------- dialog */
  #supra {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(8, 9, 12, .66);
    display: none; place-items: center; padding: 22px;
  }
  #supra.on { display: grid; }
  #dlg {
    width: 100%; max-width: 380px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 18px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, .5);
  }
  #dlgTxt { font-size: 15px; line-height: 1.5; margin-bottom: 16px; }
  .dlg-actiuni { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dlg-actiuni button {
    padding: 14px 8px; border: none; border-radius: 12px;
    background: var(--sec); color: var(--text);
    font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .dlg-actiuni button:active { background: var(--sec-hi); }
  #dlgDa { background: var(--accent); color: #fff; }
  #dlgDa:active { background: var(--accent-hi); }
  #supra.simplu .dlg-actiuni { grid-template-columns: 1fr; }
  #supra.simplu #dlgNu { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Generator numere</h1>
    <div class="sub" id="sub">1&ndash;49 &middot; f&#259;r&#259; repeti&#539;ie</div>
  </header>

  <div id="avert"></div>

  <div class="card">
    <div class="eticheta">Extragerea curent&#259;</div>
    <div id="rezultat"></div>
  </div>

  <div class="stepper">
    <span class="et">Din c&acirc;te numere</span>
    <div class="grup">
      <button class="pas" id="minusMax" aria-label="bazin mai mic">&minus;</button>
      <input id="maxim" type="number" inputmode="numeric" value="49" min="1" max="100">
      <button class="pas" id="plusMax" aria-label="bazin mai mare">+</button>
    </div>
  </div>

  <div class="stepper">
    <span class="et">C&acirc;te numere</span>
    <div class="grup">
      <button class="pas" id="minus" aria-label="mai putine">&minus;</button>
      <input id="cate" type="number" inputmode="numeric" value="6" min="1" max="49">
      <button class="pas" id="plus" aria-label="mai multe">+</button>
    </div>
  </div>

  <button id="genereaza">GENEREAZ&#258;</button>

  <div class="secundare">
    <button class="sec-btn" id="copiaza">Copiaz&#259;</button>
    <button class="sec-btn" id="anuleaza">Un pas &#238;napoi</button>
    <button class="sec-btn" id="reset">RESET</button>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="cap">
      <span class="eticheta">Bazin</span>
      <span class="contor" id="contor"></span>
    </div>
    <div class="progres"><div id="bara"></div></div>
    <div id="bazin"></div>
  </div>

  <div class="card">
    <div class="eticheta">Istoric</div>
    <div id="istoric"></div>
  </div>

</div>

<div id="supra" role="dialog" aria-modal="true">
  <div id="dlg">
    <div id="dlgTxt"></div>
    <div class="dlg-actiuni">
      <button id="dlgNu" type="button">Renun&#539;</button>
      <button id="dlgDa" type="button">Confirm&#259;</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var MIN_N = 1;              // primul numar din bazin
  var MAX_ABS = 100;          // cel mai mare bazin permis
  var MAX_IMPL = 49;          // bazinul implicit

  var CHEIE = "generator_numere_v1";

  var stare = { max: MAX_IMPL, cate: 6, folosite: [], istoric: [], ultima: [] };
  var stocareOk = true;

  function total() { return stare.max - MIN_N + 1; }

  // ------------------------------------------------------------ persistenta
  function incarca() {
    var brut;
    try {
      brut = localStorage.getItem(CHEIE);
    } catch (e) {
      stocareOk = false;                  // storage blocat de browser
      return;
    }
    if (!brut) return;
    try {
      var d = JSON.parse(brut);
      stare.max = (Number.isInteger(d.max) && d.max >= 1 && d.max <= MAX_ABS)
        ? d.max : MAX_IMPL;               // salvarile vechi nu au "max"
      stare.cate = (Number.isInteger(d.cate) && d.cate >= 1 && d.cate <= stare.max)
        ? d.cate : Math.min(6, stare.max);
      stare.folosite = (d.folosite || []).filter(function (n) {
        return Number.isInteger(n) && n >= MIN_N && n <= stare.max;
      });
      stare.istoric = Array.isArray(d.istoric) ? d.istoric : [];
      stare.ultima = Array.isArray(d.ultima) ? d.ultima : [];
    } catch (e) {
      stare = { max: MAX_IMPL, cate: 6, folosite: [], istoric: [], ultima: [] };
    }
  }

  function salveaza() {
    try {
      localStorage.setItem(CHEIE, JSON.stringify(stare));
    } catch (e) {
      if (stocareOk) {
        stocareOk = false;
        avertizeaza();
      }
    }
  }

  function avertizeaza() {
    var el = document.getElementById("avert");
    el.textContent =
      "Browserul nu permite salvarea pe disc aici. Aplicatia merge, dar " +
      "numerele consumate se pierd la inchiderea paginii. Deschide fisierul " +
      "de pe o adresa http/https, nu direct din memoria telefonului.";
    el.style.display = "block";
  }

  // ------------------------------------------------------- dialog in pagina
  // Nu folosim window.confirm / window.alert: browserul le poate bloca (bifa
  // "nu mai afisa dialoguri", moduri standalone, extensii). Cand sunt blocate,
  // confirm() returneaza false in tacere si butoanele par moarte.
  var raspunde = null;

  function inchideDlg(da) {
    document.getElementById("supra").classList.remove("on");
    var cb = raspunde;
    raspunde = null;
    if (cb) cb(da);
  }

  function intreaba(text, cb) {
    var supra = document.getElementById("supra");
    document.getElementById("dlgTxt").textContent = text;
    document.getElementById("dlgDa").textContent = "Confirm\u0103";
    supra.classList.remove("simplu");
    supra.classList.add("on");
    raspunde = cb;
    document.getElementById("dlgDa").focus();
  }

  function spune(text) {
    var supra = document.getElementById("supra");
    document.getElementById("dlgTxt").textContent = text;
    document.getElementById("dlgDa").textContent = "OK";
    supra.classList.add("simplu");
    supra.classList.add("on");
    raspunde = null;
    document.getElementById("dlgDa").focus();
  }

  // --------------------------------------------------- aleator criptografic
  function intAleator(limita) {            // 0 .. limita-1, fara bias
    var max = Math.floor(4294967296 / limita) * limita;
    var buf = new Uint32Array(1);
    var v;
    do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= max);
    return v % limita;
  }

  function extrage(bazin, cate) {          // Fisher-Yates partial
    var copie = bazin.slice(), rez = [];
    cate = Math.min(cate, copie.length);
    for (var i = 0; i < cate; i++) {
      var j = i + intAleator(copie.length - i);
      var t = copie[i]; copie[i] = copie[j]; copie[j] = t;
      rez.push(copie[i]);
    }
    return rez.sort(function (a, b) { return a - b; });
  }

  function ramase() {
    var set = new Set(stare.folosite), out = [];
    for (var n = MIN_N; n <= stare.max; n++) if (!set.has(n)) out.push(n);
    return out;
  }

  // ----------------------------------------------------------------- actiuni
  function genereaza() {
    var disp = ramase();

    if (disp.length === 0) {
      spune("Toate numerele au fost extrase");
      return;
    }

    var cate = parseInt(document.getElementById("cate").value, 10);
    if (!Number.isInteger(cate) || cate < 1) {
      spune("Introdu un num\u0103r \u00eentreg, cel pu\u021bin 1.");
      return;
    }

    // Daca au mai ramas mai putine decat ai cerut, le extrage pe cele ramase.
    // Fara intrebare: singurul mesaj de final este cel cu OK, de mai sus.
    executa(disp, Math.min(cate, disp.length));
  }

  function executa(disp, cate) {
    var noi = extrage(disp, cate);
    stare.folosite = stare.folosite.concat(noi);
    stare.ultima = noi;
    stare.istoric.push({ ora: acum(), numere: noi });

    if (navigator.vibrate) navigator.vibrate(18);
    salveaza();
    deseneaza();
  }

  function schimbaMax(nou) {
    if (!Number.isInteger(nou)) { deseneaza(); return; }
    nou = Math.min(MAX_ABS, Math.max(1, nou));
    if (nou === stare.max) { deseneaza(); return; }

    // Bazinul si istoricul apartin unei anumite marimi. Daca s-a extras deja
    // ceva, schimbarea marimii porneste de la zero.
    if (stare.folosite.length || stare.istoric.length) {
      intreaba("Schimb bazinul la 1\u2013" + nou +
               ". Extragerile de p\u00e2n\u0103 acum se \u0219terg. Continui?",
        function (da) {
          if (!da) { deseneaza(); return; }
          stare.folosite = []; stare.istoric = []; stare.ultima = [];
          aplicaMax(nou);
        });
      return;
    }

    aplicaMax(nou);
  }

  function aplicaMax(nou) {
    stare.max = nou;
    if (stare.cate > nou) stare.cate = nou;   // nu poti cere mai multe decat exista
    salveaza();
    deseneaza();
  }

  function anuleaza() {
    if (stare.istoric.length === 0) { spune("Nu exist\u0103 nicio extragere."); return; }
    var ultimaIntrare = stare.istoric.pop();
    var sters = new Set(ultimaIntrare.numere);
    stare.folosite = stare.folosite.filter(function (n) { return !sters.has(n); });
    stare.ultima = stare.istoric.length
      ? stare.istoric[stare.istoric.length - 1].numere : [];
    salveaza();
    deseneaza();
  }

  function reset() {
    stare.folosite = []; stare.istoric = []; stare.ultima = [];  // "max" si "cate" raman
    salveaza();
    deseneaza();
  }

  function copiaza() {
    if (!stare.istoric.length) { spune("Nu exist\u0103 nicio extragere de copiat."); return; }

    // Aceeasi ordine ca in lista Istoric: cea mai recenta extragere prima.
    var txt = stare.istoric.slice().reverse().filter(function (intrare) {
      return intrare && Array.isArray(intrare.numere) && intrare.numere.length;
    }).map(function (intrare) {
      return intrare.numere.join("  ");
    }).join("\n");

    if (!txt) { spune("Nu exist\u0103 nicio extragere de copiat."); return; }

    if (navigator.clipboard) {
      navigator.clipboard.writeText(txt).catch(function () { copiazaVechi(txt); });
    } else {
      copiazaVechi(txt);
    }
    var b = document.getElementById("copiaza");
    b.textContent = "Copiat";
    setTimeout(function () { b.textContent = "Copiaz\u0103"; }, 1200);
  }

  function copiazaVechi(txt) {
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) { /* ignor */ }
    document.body.removeChild(ta);
  }

  function acum() {
    var d = new Date(), p = function (x) { return String(x).padStart(2, "0"); };
    return p(d.getDate()) + "." + p(d.getMonth() + 1) + "." + d.getFullYear() +
           " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  // ----------------------------------------------------------------- afisare
  function deseneaza() {
    var disp = ramase(), folosite = new Set(stare.folosite),
        noi = new Set(stare.ultima);

    // extragerea curenta
    var rez = document.getElementById("rezultat");
    rez.innerHTML = "";
    if (!stare.ultima.length) {
      rez.innerHTML = '<span class="gol">apas\u0103 GENEREAZ\u0102</span>';
    } else {
      var n = stare.ultima.length;
      var dim = n <= 6 ? 58 : n <= 12 ? 46 : n <= 24 ? 36 : 28;
      stare.ultima.forEach(function (num, i) {
        var b = document.createElement("div");
        b.className = "bila";
        b.textContent = num;
        b.style.width = dim + "px";
        b.style.height = dim + "px";
        b.style.fontSize = Math.round(dim * 0.42) + "px";
        b.style.animationDelay = (i * 55) + "ms";
        rez.appendChild(b);
      });
    }

    // bazin (se reconstruieste doar cand se schimba marimea)
    var bazin = document.getElementById("bazin");
    if (bazin.children.length !== total()) {
      bazin.innerHTML = "";
      for (var k = MIN_N; k <= stare.max; k++) {
        var c = document.createElement("div");
        c.className = "n"; c.textContent = k;
        bazin.appendChild(c);
      }
      var coloane = total() > 49 ? 10 : 7;
      bazin.style.gridTemplateColumns = "repeat(" + coloane + ", 1fr)";
      bazin.classList.toggle("dens", coloane === 10);
    }
    for (var i = 0; i < total(); i++) {
      var num = MIN_N + i, el = bazin.children[i];
      el.className = "n" + (noi.has(num) ? " nou" : folosite.has(num) ? " folosit" : "");
    }

    // subtitlu, contor si progres
    document.getElementById("sub").textContent =
      "1\u2013" + stare.max + " \u00b7 f\u0103r\u0103 repeti\u021bie";
    document.getElementById("contor").textContent =
      disp.length + " disponibile \u00b7 " + stare.istoric.length + " extrageri";
    document.getElementById("bara").style.width =
      ((total() - disp.length) / total() * 100) + "%";

    // limite steppere
    document.getElementById("maxim").value = stare.max;

    // "Cate numere" arata alegerea utilizatorului, nu cate au mai ramas:
    // altfel valoarea s-ar pierde pe masura ce bazinul se goleste.
    var camp = document.getElementById("cate");
    camp.max = stare.max;
    camp.value = stare.cate;

    // istoric
    var ist = document.getElementById("istoric");
    ist.innerHTML = "";
    if (!stare.istoric.length) {
      ist.innerHTML = '<div class="gol">nicio extragere \u00eenc\u0103</div>';
    } else {
      stare.istoric.slice().reverse().forEach(function (intrare, i) {
        var nr = stare.istoric.length - i;
        var rand = document.createElement("div");
        rand.className = "rand";
        rand.innerHTML =
          '<span class="idx">#' + nr + '</span>' +
          '<span class="ora">' + intrare.ora + '</span>' +
          '<span class="nums">' + intrare.numere.join("  ") + '</span>';
        ist.appendChild(rand);
      });
    }
  }

  function ajusteaza(delta) {
    var v = parseInt(document.getElementById("cate").value, 10);
    if (!Number.isInteger(v)) v = stare.cate;
    stare.cate = Math.min(stare.max, Math.max(1, v + delta));
    salveaza();
    deseneaza();
  }

  function scrieCate() {                   // valoare tastata direct in camp
    var v = parseInt(document.getElementById("cate").value, 10);
    if (Number.isInteger(v)) stare.cate = Math.min(stare.max, Math.max(1, v));
    salveaza();
    deseneaza();
  }

  // ------------------------------------------------------------------ pornire
  document.getElementById("genereaza").addEventListener("click", genereaza);
